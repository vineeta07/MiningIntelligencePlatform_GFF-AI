version: '3.8'

services:
  # PostgreSQL — Relational operational data
  postgres:
    image: postgres:16-alpine
    container_name: mip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mip_admin
      POSTGRES_PASSWORD: mip_secure_2025
      POSTGRES_DB: mining_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mip_admin -d mining_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB — Unstructured telemetry data
  mongodb:
    image: mongo:7
    container_name: mip-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mip_admin
      MONGO_INITDB_ROOT_PASSWORD: mip_secure_2025
      MONGO_INITDB_DATABASE: mining_telemetry
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible object storage for images
  minio:
    image: minio/minio:latest
    container_name: mip-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: mip_minio_admin
      MINIO_ROOT_PASSWORD: mip_minio_secure_2025
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Message broker for Celery async tasks
  redis:
    image: redis:7-alpine
    container_name: mip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  minio_data:
  redis_data:
